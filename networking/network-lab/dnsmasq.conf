# The café's DNS server: it knows the names in cafe.lan and nothing else
# (the lab isn't connected to the internet, so other names are REFUSED).
interface=eth0
no-resolv
no-hosts
domain-needed
local=/cafe.lan/
domain=cafe.lan
host-record=router.cafe.lan,router,192.168.10.254
host-record=pc1.cafe.lan,pc1,192.168.10.21
host-record=pc2.cafe.lan,pc2,192.168.10.22
host-record=printer.cafe.lan,printer,192.168.10.50
host-record=dns.cafe.lan,dns,10.0.20.53
host-record=web.cafe.lan,web,10.0.20.80
