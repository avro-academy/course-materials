<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>To-do List</h1>
    <p class="intro">Add tasks, tick them off, and they'll still be here when you come back.</p>

    <form id="todo-form">
      <label for="task-input" class="visually-hidden">New task</label>
      <input id="task-input" type="text" placeholder="e.g. Wipe tables" autocomplete="off">
      <button type="submit">Add</button>
    </form>

    <ul id="task-list"></ul>

    <p id="summary" class="summary"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
